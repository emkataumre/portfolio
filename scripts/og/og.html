<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Open Graph card</title>
    <!--
      Layout source of truth for public/og.png, 1200 by 630 px.
      Use ?avatar=1 at 512 by 512 px to produce public/avatar/ascii-center.png.
    -->
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url(/fonts/InterVariable.woff2) format("woff2");
      }

      @font-face {
        font-family: "Cascadia Mono";
        font-style: normal;
        font-weight: 200 700;
        font-display: block;
        src: url(/fonts/CascadiaMono.woff2) format("woff2");
      }

      :root {
        --color-bg: #fafaf9;
        --color-text: #18181b;
        --color-muted: #6b6b70;
        --font-sans: "Inter", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        --font-mono: "Cascadia Mono", ui-monospace, monospace;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 40px 80px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 64px;
        background: var(--color-bg);
        font-family: var(--font-sans);
      }

      .headline {
        width: 420px;
        margin: 0;
        color: var(--color-text);
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .byline {
        margin: 32px 0 0;
        color: var(--color-muted);
        font-family: var(--font-mono);
        font-size: 22px;
        line-height: 1.4;
      }

      .pose {
        position: relative;
        flex: none;
        width: 400px;
        height: 400px;
        overflow: hidden;
        border-radius: 40px;
        color: #262629;
        background: #e9e9e6;
      }

      .pose pre {
        position: absolute;
        top: 50%;
        left: 50%;
        margin: 0;
        font-family: var(--font-mono);
        font-size: 9.8px;
        font-weight: 500;
        font-variant-ligatures: none;
        letter-spacing: 0;
        line-height: 1;
        transform: translate(-50%, -50%);
        white-space: pre;
      }

      .avatar-only .card,
      .avatar-only .pose {
        width: 512px;
        height: 512px;
      }

      .avatar-only .card {
        padding: 0;
      }

      .avatar-only .copy {
        display: none;
      }

      .avatar-only .pose {
        border-radius: 0;
      }

      .avatar-only .pose pre {
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="copy">
        <h1 class="headline">Real software, built with AI agents.</h1>
        <p class="byline">Emil Vladinov &#183; Software engineer in Copenhagen</p>
      </div>
      <div class="pose"><pre id="pose" aria-label="ASCII portrait of Emil Vladinov"></pre></div>
    </div>
    <script type="module">
      import { ASCII_POSES } from "/src/components/asciiPoses.ts";

      if (new URLSearchParams(location.search).has("avatar")) {
        document.body.classList.add("avatar-only");
      }

      document.getElementById("pose").textContent = ASCII_POSES.center;
      await Promise.all([
        document.fonts.load('500 12px "Cascadia Mono"'),
        document.fonts.load('700 64px "Inter"'),
      ]);
      document.documentElement.dataset.ready = "true";
    </script>
  </body>
</html>
